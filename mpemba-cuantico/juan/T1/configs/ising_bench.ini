; Configuracion T1 para BENCHMARK de escalado (mas pesada: d mayor).
; dt y m reducidos: la extraccion del gap no necesita la precision de maquina,
; pero d=2^5=32 da suficiente carga O(d^3) por matmul para ver el escalado.

[ising]
N     = 7        ; d = 128, dim L = 16384  (matmul O(d^3)=2M domina el overhead)
J     = 1.0
h     = 0.5
gamma = 0.4
T     = 0.8

[arnoldi]
tau      = 0.5
dt       = 4e-2  ; 13 pasos RK4 por propagador
m        = 12
restarts = 1
k        = 6
