; Configuracion T1 -- Arnoldi-Lindblad sobre la cadena de Ising disipativa.
; Modelo de referencia del informe (Seccion 6.3): d = 2^N, dim(L) = 4^N.

[ising]
N     = 4        ; numero de espines  (d = 2^N = 16, dim L = 256)
J     = 1.0      ; acoplamiento ZZ
h     = 0.5      ; campo transverso
gamma = 0.4      ; tasa de disipacion local
T     = 0.8      ; temperatura del bano

[arnoldi]
tau      = 0.5   ; paso del propagador e^{tau L}
dt       = 2e-3  ; paso de RK4 para la accion del propagador
m        = 30    ; dimension del subespacio de Krylov
restarts = 3     ; reinicios explicitos
k        = 6     ; numero de modos lentos a extraer
