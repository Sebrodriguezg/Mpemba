; Configuracion T3a -- trayectorias cuanticas sobre la cadena de Ising disipativa.
; El vector de estado vive en C^d con d=2^N; la memoria es 2^N (no 4^N), lo que
; permite N grande inviable para la ecuacion maestra.

[ising]
N     = 8        ; d = 256  (la densidad rho seria 4^8 = 65536)
J     = 1.0
h     = 0.5
gamma = 0.4
T     = 0.8

[run]
t_max     = 6.0
dt        = 5e-3
log_every = 40
M         = 2000          ; numero de trayectorias
p0_list   = 0.1, 0.5, 0.9 ; preparaciones (prob. de excitacion por sitio)

[io]
output_dir = ../results
