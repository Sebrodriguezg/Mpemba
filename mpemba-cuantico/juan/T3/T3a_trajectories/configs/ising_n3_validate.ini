; Config T3a de VALIDACION en N=3 (Liouvilliano denso 64x64 cabe en el oraculo).
[ising]
N     = 3
J     = 1.0
h     = 0.5
gamma = 0.4
T     = 0.8

[run]
t_max     = 6.0
dt        = 5e-3
log_every = 40
M         = 20000          ; muchas trayectorias para error estadistico bajo
p0_list   = 0.1, 0.9

[io]
output_dir = ../results
