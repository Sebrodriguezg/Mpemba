; Config T3a para BENCHMARK de escalado.
; N=10 -> d=1024; el Liouvilliano denso seria 4^10 ~ 1e6 x 1e6 (INVIABLE).
; Las trayectorias solo guardan 2^10 amplitudes -> el caso vive en memoria.
[ising]
N     = 10
J     = 1.0
h     = 0.5
gamma = 0.4
T     = 0.8

[run]
t_max     = 6.0
dt        = 5e-3
log_every = 60
M         = 1024
p0_list   = 0.5

[io]
output_dir = ../results
