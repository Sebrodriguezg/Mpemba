; config.ini  -- nucleo HPC del efecto Mpemba cuantico (cadena de Ising disipativa)

[ising]
N     = 4          ; numero de espines (d = 2^N ; dim(L) = 4^N)
J     = 1.0        ; acoplamiento ZZ
h     = 0.5        ; campo transverso
gamma = 0.4        ; tasa de disipacion local
T     = 0.8        ; temperatura del bano

[run]
t_max     = 8.0
dt        = 0.002
log_every = 25
T0_list   = 0.3, 0.6, 1.0, 2.0, 5.0, 20.0   ; temperaturas iniciales (preparaciones)

[io]
output_dir = results
