; configs/klich_raz_rem.ini
;
; Klich, Raz, Hirschberg, Vucelja (PRX 2019) Mpemba index.

[model]
L       = 12          ; number of energy levels (matrix dim)
T_bath  = 0.1
sigma_E = 1.0         ; variance of IID Gaussian energies (times log^2 L)
sigma_B = 5.0         ; variance of IID barriers

[ensemble]
n_realiz = 8000       ; number of disorder realizations to average
seed     = 12648430

[scan]
T_max    = 1000.0     ; max initial temperature in the scan
n_T_grid = 200

[io]
output_dir = results/klich_raz
