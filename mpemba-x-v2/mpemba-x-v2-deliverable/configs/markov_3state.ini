; configs/markov_3state.ini
;
; Markovian Mpemba effect in the 3-state Arrhenius system of Lu & Raz 2017.

[system]
name   = three_state
T_bath = 0.05

[integration]
t_max     = 80.0
dt        = 0.005
log_every = 20

[quench]
; Initial temperatures to sweep. Generates one CSV per T_init.
T_inits = 1.15, 1.5, 2.0, 2.5, 3.0, 3.5, 4.25, 5.0

[thermomajorization]
enable    = true
log_every = 100

[io]
output_dir = results/markovian
