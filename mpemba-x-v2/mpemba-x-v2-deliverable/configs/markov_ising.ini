; configs/markov_ising.ini
;
; Markovian Mpemba in a 1D antiferromagnetic Ising chain (Lu & Raz, Fig. 3).

[system]
name   = ising
T_bath = 0.05
N_ising = 8       ; chain length (state space = 2^N). N <= 12 supported.
J       = -2.0    ; antiferromagnetic coupling
h       = 0.2     ; external field

[integration]
t_max     = 60.0
dt        = 0.005
log_every = 20

[quench]
T_inits = 1.15, 4.25       ; paper's choice for hot/cold

[thermomajorization]
enable    = true
log_every = 100

[io]
output_dir = results/markovian_ising
