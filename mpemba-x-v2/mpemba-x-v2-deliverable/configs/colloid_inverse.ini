; configs/colloid_inverse.ini
;
; INVERSE Mpemba effect: anomalous heating in a colloidal system.
; (Kumar, Chetrite & Bechhoefer, PNAS 2022)
; Two cold preparations relax UPWARD toward the same hot bath.

[ensemble]
n_trajectories = 200000
seed           = 314159265

[quench]
T_cold = 0.05         ; very cold initial sample
T_cool = 0.3          ; cool (less cold) initial sample
T_bath = 1.0          ; hot bath (target)

[potential]
U0     = 4.0
tilt_a = 1.2          ; tilt of the double well (asymmetry parameter)
xmin   = -1.0
xmax   = 2.0

[integration]
t_max           = 1.0
dt              = 1e-4
n_bins          = 200
n_steps_per_log = 50

[io]
output_dir = results/langevin_inverse
