; configs/granular.ini
;
; Granular Mpemba effect (Lasanta et al. 2017, analytic moment equations).

[model]
alpha = 0.9       ; coefficient of restitution

[preparation_A]
T_initial  = 1.00     ; initially hotter
a2_initial = 0.50     ; large positive kurtosis (fat tails)

[preparation_B]
T_initial  = 0.99     ; initially cooler
a2_initial = -0.35    ; negative kurtosis

[integration]
t_max     = 8.0
dt        = 0.001
log_every = 10

[io]
output_dir = results/granular_analytic
