; configs/quantum_qubit.ini
;
; Quantum Mpemba in a 2-level Lindblad system + metrological QFI tracking.
; (Carollo 2021; Chattopadhyay et al. 2026)

[model]
omega0 = 1.0          ; qubit energy gap (units of kB T_bath)
gamma  = 1.0          ; system-bath coupling rate

[system]
T_bath = 1.0          ; bath temperature (natural units)

[quench]
; Initial temperatures: hot, warm, cold (to detect Mpemba + metrological gain)
T_inits = 0.3, 0.8, 1.5, 3.0, 10.0

[integration]
t_max     = 6.0
dt        = 0.001
log_every = 20

[io]
output_dir = results/quantum_lindblad
