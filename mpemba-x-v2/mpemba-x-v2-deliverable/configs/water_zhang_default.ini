; configs/water_zhang_default.ini
;
; Default water Mpemba experiment using Zhang et al. 2014 macroscopic
; Fourier model with hydrogen-bond memory and skin supersolidity.
;
; This is a STARTING POINT. Edit the [water] section to match your
; experimental conditions (mass, geometry, temperatures).

[water]
mass_g            = 50.0          ; mass of water in grams
tube_length_m     = 0.01          ; tube length (m). For a beaker, use diameter as L.
skin_thickness_m  = 0.0005        ; skin layer at the drain interface (Zhang: ~1 mm)

[simulation]
n_grid    = 200                   ; spatial grid resolution
t_max_s   = 3000.0                ; total simulation time in seconds
dt_log_s  = 10.0                  ; how often to record the temperature field
dt_step_s = 10.0                  ; max time per outer step (substeps internally)

[preparation_hot]
T_initial_C  = 90.0               ; HOT water initial temperature (degrees C)

[preparation_cold]
T_initial_C  = 30.0               ; COLD water initial temperature

[bath]
T_bath_C       = -10.0            ; ambient/bath temperature (freezer)
h_drain_W_m2_K = 30.0             ; Robin BC heat transfer coefficient

[zhang_model]
; Hydrogen-bond memory and supersolidity parameters (Zhang 2014 PCCP)
rho_skin_over_bulk = 0.75         ; supersolid skin: 0.75 of bulk density
kappa_skin_factor  = 1.333        ; skin thermal conductivity factor (4/3)
C_mem_J_per_m3     = 50000.0      ; coupling coefficient for bond-memory release
conv_velocity_m_s  = 0.0001       ; ~1e-4 m/s, convection at skin

[io]
output_dir = results/water_fourier
