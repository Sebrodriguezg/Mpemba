; configs/water_realistic.ini
;
; Realistic water Mpemba demonstration with a thin geometry that
; cools to the bath in reasonable time.

[water]
mass_g            = 50.0
tube_length_m     = 0.05          ; 5 cm column
skin_thickness_m  = 0.002         ; 2 mm skin

[simulation]
n_grid    = 100
t_max_s   = 1800.0                ; 30 min
dt_log_s  = 5.0
dt_step_s = 5.0

[preparation_hot]
T_initial_C  = 95.0

[preparation_cold]
T_initial_C  = 30.0

[bath]
T_bath_C       = -18.0
h_drain_W_m2_K = 200.0            ; strong convective cooling (freezer with airflow)

[zhang_model]
rho_skin_over_bulk = 0.75
kappa_skin_factor  = 1.333
C_mem_J_per_m3     = 80000.0      ; stronger memory coupling
conv_velocity_m_s  = 0.0005

[io]
output_dir = results/water_realistic
