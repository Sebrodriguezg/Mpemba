; configs/water_demo.ini
;
; Realistic Mpemba experiment: 100 g water sample in a vessel.
; Total cooling time ~30 minutes to freezer.

[water]
mass_g            = 100.0
tube_length_m     = 0.08         ; 8 cm tall column
skin_thickness_m  = 0.003

[simulation]
n_grid    = 60
t_max_s   = 2400.0               ; 40 min total
dt_log_s  = 10.0

[preparation_hot]
T_initial_C = 95.0

[preparation_cold]
T_initial_C = 30.0

[bath]
T_bath_C       = -18.0
h_drain_W_m2_K = 25.0            ; passive convection in freezer

[zhang_model]
rho_skin_over_bulk = 0.75
kappa_skin_factor  = 1.333
C_mem_J_per_m3     = 5e7
conv_velocity_m_s  = 0.0005

[io]
output_dir = results/water_demo
