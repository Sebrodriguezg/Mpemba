; configs/water_md_jin_goddard.ini
;
; Coarse-grained molecular dynamics of water Mpemba quench
; (Jin & Goddard 2015 protocol, mW-style potential).

[system]
n_particles      = 256
density_reduced  = 0.55           ; reduced number density (rho * sigma^3)

[quench]
; Initial temperatures (Kelvin). Paper used 300 K vs 370 K.
T_inits_K = 250, 300, 370, 450
T_bath_K  = 100                   ; quench target

[integration]
dt              = 0.005           ; reduced time units (~0.0018 ps)
n_equil_steps   = 2000            ; equilibration at T_init
n_quench_steps  = 8000            ; relaxation under T_bath thermostat
thermostat_tau  = 50.0            ; Berendsen tau (reduced units)
log_every       = 50

[ensemble]
seed = 3405691582

[io]
output_dir = results/water_md
