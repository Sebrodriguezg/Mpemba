; configs/water_lab_100g.ini
;
; TEMPLATE for an experimental Mpemba run with 100 g water samples.
;
; Edit ALL [preparation_*] and [bath] values to match what you measured
; in the lab. The output files can then be compared directly to your
; experimental thermograms.

[water]
mass_g           = 100.0          ; ← measured mass of YOUR water sample
tube_length_m    = 0.05           ; ← effective length (cylinder height or bead diameter)
skin_thickness_m = 0.001

[simulation]
n_grid    = 250
t_max_s   = 1800.0                ; 30 minutes
dt_log_s  = 5.0                   ; record T(x) profile every 5 s
dt_step_s = 5.0

[preparation_hot]
T_initial_C = 80.0                ; ← edit to YOUR hot sample initial T

[preparation_cold]
T_initial_C = 25.0                ; ← edit to YOUR cold sample initial T

[bath]
T_bath_C       = -18.0            ; ← edit to YOUR freezer T (-18 C is typical home freezer)
h_drain_W_m2_K = 25.0             ; tunable to match your experiment's cooling rate

[zhang_model]
rho_skin_over_bulk = 0.75
kappa_skin_factor  = 1.333
C_mem_J_per_m3     = 80000.0
conv_velocity_m_s  = 0.00015

[io]
output_dir = results/water_lab_100g
